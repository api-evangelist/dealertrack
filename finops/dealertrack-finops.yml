principles:
- name: Visibility
  description: Track annual certification and per-API data-access fees per integration and per dealer; there is no metered request line item to monitor.
- name: Allocation
  description: Map Opentrack data fees to the dealership integrations and internal products that consume DMS data.
- name: Optimization
  description: Consider routing through a certified Opentrack partner to avoid direct certification overhead when integrating with many DMS providers; scope data access to only the APIs actually needed.
- name: Accountability
  description: Assign an owner for the Opentrack / Cox Automotive partner relationship and review annual fees against the value delivered by the integration.
