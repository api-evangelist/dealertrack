description: >-
  FinOps view of Dealertrack (Cox Automotive) integration spend. There is no
  usage-metered public API price. Cost is contract-driven: Opentrack certified
  vendors pay nominal annual certification fees plus data-access fees set per vendor
  and per API, or route through a certified Opentrack partner whose commercial terms
  apply. Cox Automotive Integration Platform access is a negotiated partner agreement.
  For dealerships, DMS and F&I costs sit inside the broader Dealertrack subscription
  and data-fee schedule. Exact rates are not published and are not reconciled here.
notes: >-
  Dominant cost drivers are annual certification/partner fees and per-API data-access
  fees rather than metered request volume. Verify current terms with Dealertrack /
  Cox Automotive during reconciliation.
