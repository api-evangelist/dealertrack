actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public WebSocket or server-push transport exists to model, and Dealertrack
    publishes no open API reference. The real integration surfaces (Opentrack and
    the Cox Automotive Integration Platform) are partner-gated request/response
    REST over HTTPS. The apis.yml documents these honestly with endpointsModeled
    flags rather than fabricating endpoints, and no AsyncAPI document was created.
