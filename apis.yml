    type: Documentation
  - url: https://us.dealertrack.com/content/dealertrack/en/integrations.html
    type: Documentation
  - url: https://developer.coxautoinc.com/
    type: Portal
  description: >-
    Real-time, bidirectional write access to the Dealertrack DMS through Opentrack.
    Certified vendors can push data back into the DMS - creating new deals, updating
    customer records, booking service appointments, posting payments, and writing
    journal entries to the general ledger. Like the read side, this is partner-gated,
    granted per dealer and per vendor, and requires Opentrack certification or a
    certified integration partner. Endpoints are modeled from public program
    documentation.
