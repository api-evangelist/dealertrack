name: Dealertrack

kind: company

description: >-
  Dealertrack is a Cox Automotive brand providing automotive dealership software -
  a cloud-based Dealer Management System (DMS), digital contracting and F&I tools,
  and the largest dealer-to-lender credit application network in the United States.
  Its developer surface is partner-gated. Dealership systems integrate through the
  Opentrack third-party integration program (real-time, bidirectional REST access to
  DMS data such as vehicles, customers, deals, repair orders, parts, and general
  ledger) and through the Cox Automotive Integration Platform partner storefront at
  developer.coxautoinc.com (OAuth-secured, partner onboarding required). Dealertrack
  publishes no open, self-service public API; access requires Opentrack certification
  and annual fees, integration through a certified Opentrack partner, or a Cox
  Automotive partner agreement. The endpoints described here are modeled from public
  product and program documentation, not from an open API reference.

