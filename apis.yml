  description: >-
    Real-time, bidirectional read access to Dealertrack DMS data through the Opentrack
    third-party integration program. Certified vendors can retrieve dealership data
    domains including vehicle inventory, customers, deals, repair orders, parts, and
    general ledger / accounting records. Access is granted per dealer and per vendor
    and requires Opentrack certification (or integration through a certified partner).
    Endpoints are modeled from Opentrack program documentation; no open API reference
    is published.
